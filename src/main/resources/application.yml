server:
  port: ${SERVER_PORT:9900}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-extensions: txt,md

milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}
  timeout: ${MILVUS_TIMEOUT:30000}

# Spring AI Alibaba DashScope 配置
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/superbiz_agent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:superbiz}
    password: ${SPRING_DATASOURCE_PASSWORD:superbiz1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}  # 从环境变量读取
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: ${TENCENT_MCP_URL:https://mcp-api.tencent-cloud.com}
              sse-endpoint: ${TENCENT_MCP_SSE_ENDPOINT:/sse/replace-with-your-endpoint}
    alibaba:
      toolcalling:
        python:
          enabled: true
          engine:
            warn-interpreter-only: false
          context:
            allow-all-access: false
            allow-io: false
            allow-native-access: false
            allow-create-process: false
            allow-host-access: false
# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}  # 从环境变量读取（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称

memory:
  base-path: ${MEMORY_BASE_PATH:./memory}
  max-index-lines: 200
  short-memory-pairs: 6
  short-compression:
    enabled: true
    threshold: 12
    keep-recent: 6
    max-records: 30
  long-extraction:
    enabled: true
    success-threshold: 5
    before-compression: true

skills:
  base-path: ${SKILLS_BASE_PATH:./skills}
  script-runner:
    enabled: true
    python-command: python3
    timeout-seconds: 30
    max-output-chars: 12000

sandbox:
  enabled: ${SANDBOX_ENABLED:true}
  docker-command: ${SANDBOX_DOCKER_COMMAND:docker}
  python-image: ${SANDBOX_PYTHON_IMAGE:superbiz-agent:latest}
  python-entrypoint: ${SANDBOX_PYTHON_ENTRYPOINT:python3}
  app-root: ${SANDBOX_APP_ROOT:./sandbox}
  mount-type: ${SANDBOX_MOUNT_TYPE:volume}
  volume-name: ${SANDBOX_VOLUME_NAME:superbiz-sandbox-data}
  host-root: ${SANDBOX_HOST_ROOT:./sandbox}
  container-root: ${SANDBOX_CONTAINER_ROOT:/sandbox}
  network: ${SANDBOX_NETWORK:none}
  cpus: ${SANDBOX_CPUS:1}
  memory: ${SANDBOX_MEMORY:512m}
  pids-limit: ${SANDBOX_PIDS_LIMIT:128}
  timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:30}
  max-output-chars: ${SANDBOX_MAX_OUTPUT_CHARS:12000}
  keep-runs: ${SANDBOX_KEEP_RUNS:false}

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
#  timeout: 10  # 超时时间（秒）
  mock-enabled: true  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）

# MySQL 工具配置
mysql:
  tool:
    enabled: false
    url: ${MYSQL_TOOL_URL:jdbc:mysql://localhost:3306/superbiz_agent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${MYSQL_TOOL_USERNAME:superbiz}
    password: ${MYSQL_TOOL_PASSWORD:superbiz1234}
    query-timeout-seconds: 10

# 外网查询工具配置
web:
  tool:
    enabled: true
    timeout-seconds: 10
    max-response-chars: 12000

# 公共搜索工具配置
search:
  tool:
    timeout-seconds: 10
    max-results: 5

# 天气/地图工具配置
weather-map:
  tool:
    timeout-seconds: 10
    max-map-results: 5

# Agent 安全限制
agent:
  safety:
    model-call-limit: 12
    tool-call-limit: 12

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
